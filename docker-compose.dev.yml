version: '3.8'

services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      # LLM provider: "claude" (subscription via CLI), "azure", "openai", or "mock"
      - LLM_PROVIDER=${LLM_PROVIDER:-claude}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
    volumes:
      - ./backend:/app
      # Mount the host's Claude subscription credentials so `claude -p` works
      # inside the container (read-only). Requires `claude` login on the host.
      - ${HOME}/.claude:/root/.claude:ro
    networks:
      - app-network

  mock_sdwan:
    build:
      context: ./mock_api
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    networks:
      - app-network

  mock_servicenow:
    build:
      context: ./mock_snow
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    networks:
      - app-network

  react-ui:
    build:
      context: ./react-ui
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      # node_modules is installed on the host (bind-mounted) rather than baked
      # into the image — the in-image `npm install` is unreliably slow here.
      - ./react-ui:/app
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    networks:
      - app-network

volumes:
  postgres_data:


networks:
  app-network:
    driver: bridge
